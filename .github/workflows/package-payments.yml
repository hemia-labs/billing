name: Payments package validation

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_dispatch:
  workflow_call:
    inputs:
      preserve-release-artifact:
        description: Preserve the validated tarball for the release job
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: payments-package-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  payments:
    name: Payments package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: node --test test/release/payments-release.test.mjs
      - name: Identify a version-only PR
        id: version-pr
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/payments-release.mjs classify "$BASE_SHA"
      - name: Verify Changesets on PRs
        if: github.event_name == 'pull_request' && steps.version-pr.outputs.release != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bun run changeset status --since "$BASE_SHA"
      - run: bun run --cwd packages/payments typecheck
      - run: bun run --cwd packages/payments build
      - run: bun run --cwd packages/payments test
      - run: bun run --cwd packages/payments test:nest
      - name: Validate the npm tarball
        env:
          PAYMENTS_RELEASE_DIR: ${{ inputs.preserve-release-artifact && format('{0}/payments-release', runner.temp) || '' }}
        run: node test/payments/package/check-payments-tarball.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.preserve-release-artifact
        with:
          name: payments-release
          path: ${{ runner.temp }}/payments-release/
          if-no-files-found: error
          retention-days: 7
